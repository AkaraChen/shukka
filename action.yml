name: 'Shukka Publish'
description: 'Publish an electron-builder output directory to a Shukka update channel'
author: 'akarachen'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  server-url:
    description: 'Base URL of the Shukka instance, e.g. https://updates.example.com'
    required: true
  api-key:
    description: 'Shukka API key bound to the target app'
    required: true
  app:
    description: 'App slug as configured in Shukka'
    required: true
  channel:
    description: 'Target channel'
    required: false
    default: 'stable'
  directory:
    description: 'electron-builder output directory containing artifacts and latest*.yml'
    required: false
    default: 'dist'
  version:
    description: 'Release version; read from the .yml metadata when omitted'
    required: false
    default: ''
  create-channel:
    description: 'Create the channel if it does not exist yet'
    required: false
    default: 'false'

outputs:
  version:
    description: 'The published version'
    value: ${{ steps.publish.outputs.version }}
  channel:
    description: 'The channel the version was published to'
    value: ${{ steps.publish.outputs.channel }}

runs:
  using: 'composite'
  steps:
    - id: publish
      shell: bash
      env:
        SHUKKA_SERVER_URL: ${{ inputs.server-url }}
        SHUKKA_API_KEY: ${{ inputs.api-key }}
        SHUKKA_APP: ${{ inputs.app }}
        SHUKKA_CHANNEL: ${{ inputs.channel }}
        SHUKKA_DIRECTORY: ${{ inputs.directory }}
        SHUKKA_VERSION: ${{ inputs.version }}
        SHUKKA_CREATE_CHANNEL: ${{ inputs.create-channel }}
      run: node "$GITHUB_ACTION_PATH/scripts/shukka-upload.mjs"
